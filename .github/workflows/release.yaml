name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match the tag to pubspec.yaml
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(sed -nE 's/^version: ([^+]+).*/\1/p' pubspec.yaml)"
          test -n "$package_version"
          test "$tag_version" = "$package_version"

  android:
    name: Build Android APK
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --flavor prod -t lib/main_prod.dart
      - name: Package APK
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir release-assets
          cp build/app/outputs/flutter-apk/app-prod-release.apk "release-assets/shadowing-english-${TAG}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: release-assets/*

  linux:
    name: Build Linux bundle
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          cache: true
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libmpv-dev nasm ninja-build
      - name: Cache subtitle FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: build/ffmpeg-bundle/linux-x64
          key: ffmpeg-8.1.2-linux-x64-${{ hashFiles('tool/ffmpeg/build_ffmpeg.sh') }}
      - name: Build subtitle FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash tool/ffmpeg/build_ffmpeg.sh linux-x64 build/ffmpeg-bundle/linux-x64
      - name: Smoke test subtitle FFmpeg
        run: |
          ffmpeg_bin="build/ffmpeg-bundle/linux-x64/ffmpeg"
          smoke_dir="$(mktemp -d)"
          "$ffmpeg_bin" -y -f lavfi -i sine=frequency=1000:duration=2 -c:a pcm_s16le "$smoke_dir/input.wav"
          "$ffmpeg_bin" -y -i "$smoke_dir/input.wav" -vn -ac 1 -ar 16000 -b:a 24k -f segment -segment_time 1 -reset_timestamps 1 "$smoke_dir/chunk_%05d.m4a"
          test -s "$smoke_dir/chunk_00000.m4a"
          "$ffmpeg_bin" -y -i "$smoke_dir/input.wav" -i tool/ffmpeg/smoke.srt -c:a aac -c:s mov_text -f ipod "$smoke_dir/embedded.mp4"
          "$ffmpeg_bin" -v error -i "$smoke_dir/embedded.mp4" -map 0:s:0 -f srt - | grep -q "Hello from the subtitle smoke test"
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Bundle subtitle FFmpeg
        run: |
          mkdir -p build/linux/x64/release/bundle/lib/ffmpeg
          cp -a build/ffmpeg-bundle/linux-x64/. build/linux/x64/release/bundle/lib/ffmpeg/
          test -x build/linux/x64/release/bundle/lib/ffmpeg/ffmpeg
      - name: Package Linux bundle
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir release-assets
          tar -C build/linux/x64/release -czf "release-assets/shadowing-english-${TAG}-linux-x64.tar.gz" bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release-assets/*

  macos:
    name: Build macOS app
    needs: verify-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          cache: true
      - name: Cache subtitle FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: build/ffmpeg-bundle/macos-universal
          key: ffmpeg-8.1.2-macos-universal-${{ hashFiles('tool/ffmpeg/build_ffmpeg.sh') }}
      - name: Build subtitle FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash tool/ffmpeg/build_ffmpeg.sh macos-universal build/ffmpeg-bundle/macos-universal
      - name: Smoke test subtitle FFmpeg
        run: |
          ffmpeg_bin="build/ffmpeg-bundle/macos-universal/ffmpeg"
          smoke_dir="$(mktemp -d)"
          "$ffmpeg_bin" -y -f lavfi -i sine=frequency=1000:duration=2 -c:a pcm_s16le "$smoke_dir/input.wav"
          "$ffmpeg_bin" -y -i "$smoke_dir/input.wav" -vn -ac 1 -ar 16000 -b:a 24k -f segment -segment_time 1 -reset_timestamps 1 "$smoke_dir/chunk_%05d.m4a"
          test -s "$smoke_dir/chunk_00000.m4a"
          "$ffmpeg_bin" -y -i "$smoke_dir/input.wav" -i tool/ffmpeg/smoke.srt -c:a aac -c:s mov_text -f ipod "$smoke_dir/embedded.mp4"
          "$ffmpeg_bin" -v error -i "$smoke_dir/embedded.mp4" -map 0:s:0 -f srt - | grep -q "Hello from the subtitle smoke test"
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package macOS app
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir release-assets dmg-root
          app_path="$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          mkdir -p "$app_path/Contents/Resources/ffmpeg"
          cp -a build/ffmpeg-bundle/macos-universal/. "$app_path/Contents/Resources/ffmpeg/"
          test -x "$app_path/Contents/Resources/ffmpeg/ffmpeg"
          codesign --force --deep --sign - "$app_path"
          codesign --verify --deep --strict "$app_path"
          cp -R "$app_path" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "Shadowing English" -srcfolder dmg-root -ov -format UDZO \
            "${GITHUB_WORKSPACE}/release-assets/shadowing-english-${TAG}-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release-assets/*

  windows:
    name: Build Windows bundle
    needs: verify-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          cache: true
      - name: Cache subtitle FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: build/ffmpeg-bundle/windows-x64
          key: ffmpeg-8.1.2-windows-x64-${{ hashFiles('tool/ffmpeg/build_ffmpeg.sh') }}
      - uses: msys2/setup-msys2@v2
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        with:
          install: make diffutils nasm mingw-w64-x86_64-gcc
          msystem: MINGW64
      - name: Build subtitle FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash tool/ffmpeg/build_ffmpeg.sh windows-x64 build/ffmpeg-bundle/windows-x64
      - name: Smoke test subtitle FFmpeg
        shell: pwsh
        run: |
          $ffmpeg = "build/ffmpeg-bundle/windows-x64/ffmpeg.exe"
          $smoke = "build/ffmpeg-smoke"
          New-Item -ItemType Directory -Force $smoke | Out-Null
          & $ffmpeg -y -f lavfi -i "sine=frequency=1000:duration=2" -c:a pcm_s16le "$smoke/input.wav"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $ffmpeg -y -i "$smoke/input.wav" -vn -ac 1 -ar 16000 -b:a 24k -f segment -segment_time 1 -reset_timestamps 1 "$smoke/chunk_%05d.m4a"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$smoke/chunk_00000.m4a")) { exit 1 }
          & $ffmpeg -y -i "$smoke/input.wav" -i tool/ffmpeg/smoke.srt -c:a aac -c:s mov_text -f ipod "$smoke/embedded.mp4"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $subtitle = & $ffmpeg -v error -i "$smoke/embedded.mp4" -map 0:s:0 -f srt -
          if ($LASTEXITCODE -ne 0 -or ($subtitle -join "`n") -notmatch "Hello from the subtitle smoke test") { exit 1 }
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Bundle subtitle FFmpeg
        shell: pwsh
        run: |
          Copy-Item build/ffmpeg-bundle/windows-x64 build/windows/x64/runner/Release/ffmpeg -Recurse
          if (-not (Test-Path build/windows/x64/runner/Release/ffmpeg/ffmpeg.exe)) { exit 1 }
      - name: Package Windows bundle
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force release-assets
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "release-assets/shadowing-english-$env:TAG-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release-assets/*

  publish:
    name: Publish GitHub Release
    needs: [android, linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Create release with generated update notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
